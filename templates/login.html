<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal Acadêmico SIGEU</title>
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-academic-header">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="SIGEU" class="login-logo">
            <div>
                <div class="login-kicker">PORTAL ACADÊMICO</div>
                <div class="login-title">SIGEU Educacional</div>
                <div class="login-subtitle">Ambiente Virtual de Aprendizagem</div>
            </div>
        </div>
        <form method="POST" autocomplete="on">
            <div class="form-group">
                <label for="ra"><i class="fas fa-id-card"></i> Matrícula / RA</label>
                <input type="text" id="ra" name="ra" inputmode="numeric" autocomplete="username" required placeholder="Digite seu RA de 8 dígitos">
            </div>
            <div class="form-group">
                <label for="senha"><i class="fas fa-lock"></i> Senha</label>
                <input type="password" id="senha" name="senha" autocomplete="current-password" required placeholder="Digite sua senha">
            </div>
            <button type="submit" class="btn btn-primary login-submit"><i class="fas fa-sign-in-alt"></i> Acessar Plataforma</button>
        </form>
        <div class="login-help">
            <strong>Primeiro acesso</strong>
            <p>Utilize a matrícula/RA informada pela instituição e a senha inicial recebida no seu e-mail de boas-vindas.</p>
            <p>Em caso de dificuldade, procure a Secretaria Acadêmica.</p>
        </div>
        <div class="login-footer">SIGEU Educacional · Portal Acadêmico</div>
    </div>
</body>
</html>
