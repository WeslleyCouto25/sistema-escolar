name: Validacao PicPay MEW
on:
  pull_request:
    paths:
      - 'app.py'
      - 'migrate.py'
      - 'picpay_mew.py'
      - 'cobrancas_avulsas.py'
      - 'templates/cobranca_avulsa_cliente.html'
      - 'templates/contrato_cobranca_avulsa.html'
      - 'templates/mew/cobrancas_avulsas.html'
      - 'tests/test_cobrancas_avulsas.py'
      - 'templates/mew/alunos.html'
      - 'tests/test_picpay_mew.py'
      - '.github/workflows/picpay-mew-tests.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencias minimas
        run: python -m pip install 'Flask==3.1.2' 'requests==2.32.5' 'Pillow==12.1.0'
      - name: Testes e verificacao sintatica
        run: |
          python -m unittest discover -s tests -p 'test_picpay_mew.py' -v
          python -m unittest discover -s tests -p 'test_cobrancas_avulsas.py' -v
