name: Verificar backup integral R2 e smoke de cadastro
on:
  pull_request:
    paths:
      - 'migrate.py'
      - 'backup_sigeu.py'
      - 'backup_postgres_full_r2.py'
      - 'cobrancas_avulsas.py'
      - 'templates/mew/backups.html'
      - '.github/workflows/backup-integral.yml'
  push:
    paths:
      - 'migrate.py'
      - 'backup_sigeu.py'
      - 'backup_postgres_full_r2.py'
      - 'cobrancas_avulsas.py'
      - 'templates/mew/backups.html'
      - '.github/workflows/backup-integral.yml'
jobs:
  static-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verificar sintaxe e importação estática
        run: python -m py_compile app.py migrate.py backup_sigeu.py backup_postgres_full_r2.py cobrancas_avulsas.py r2_storage.py
      - name: Verificar template Jinja
        run: |
          python -m pip install --quiet jinja2
          python -c "from jinja2 import Environment; Environment().parse(open('templates/mew/backups.html', encoding='utf-8').read())"
      - name: Regressão do cadastro
        run: python -m unittest discover -s tests -p 'test_schema_alunos.py' -v
